<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Imagen y Sitio de Serie</title>
  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* Reset y base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      padding: 24px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 720px;
      width: 100%;
      margin: 20px auto;
      background: #ffffff;
      border-radius: 32px;
      padding: 36px 40px;
      box-shadow: 0 20px 60px rgba(0, 20, 40, 0.08), 0 8px 24px rgba(0, 20, 40, 0.04);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #0b2b5c;
      text-align: center;
      margin-bottom: 32px;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    h1 i {
      color: #1a73e8;
      font-size: 26px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      color: #0b2b5c;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .form-group label i {
      margin-right: 8px;
      color: #1a73e8;
      width: 20px;
      text-align: center;
    }

    .form-group select,
    .form-group input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-size: 15px;
      background: #fafcff;
      transition: all 0.2s;
      font-family: inherit;
      color: #0b2b5c;
    }

    .form-group select:focus,
    .form-group input[type="text"]:focus {
      border-color: #1a73e8;
      outline: none;
      box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.1);
      background: white;
    }

    .form-group select {
      appearance: auto;
      cursor: pointer;
    }

    .form-group select:disabled {
      background: #f1f5f9;
      opacity: 0.7;
    }

    .inline-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .inline-group select {
      flex: 1;
    }

    .inline-group .btn-icon {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 16px;
      border: 2px solid #e2e8f0;
      background: #fafcff;
      color: #1a73e8;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }

    .inline-group .btn-icon:hover {
      background: #1a73e8;
      color: white;
      border-color: #1a73e8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(26, 115, 232, 0.2);
    }

    .hidden-input-group {
      display: none;
      margin-top: 10px;
      padding: 14px;
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
    }

    .hidden-input-group input {
      border-radius: 12px;
    }

    .hidden-input-group .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .hidden-input-group .btn-group button {
      padding: 6px 16px;
      border-radius: 30px;
      background: #e9edf4;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .hidden-input-group .btn-group button:first-child {
      background: #1a73e8;
      color: white;
    }

    .hidden-input-group .btn-group button:first-child:hover {
      background: #1557b0;
    }

    .hidden-input-group .btn-group button:last-child {
      background: #e9edf4;
      color: #1e293b;
    }

    .hidden-input-group .btn-group button:last-child:hover {
      background: #d1d9e6;
    }

    .preview {
      margin-top: 20px;
      text-align: center;
      background: #f8fafc;
      border-radius: 20px;
      padding: 20px;
      border: 1px dashed #d1d9e6;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      border: 1px solid #e9edf4;
    }

    .preview .placeholder {
      color: #94a3b8;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .preview .placeholder i {
      font-size: 40px;
      color: #cbd5e1;
    }

    .acciones {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
      justify-content: flex-end;
    }

    .acciones button {
      padding: 12px 28px;
      border-radius: 40px;
      border: none;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: inherit;
      background: #1a73e8;
      color: white;
    }

    .acciones button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26, 115, 232, 0.25);
    }

    .acciones .btn-cloudflare {
      background: #f6821f;
    }

    .acciones .btn-cloudflare:hover {
      background: #d96f1a;
      box-shadow: 0 6px 20px rgba(246, 130, 31, 0.25);
    }

    .acciones .btn-guardar {
      background: #10b981;
    }

    .acciones .btn-guardar:hover {
      background: #059669;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.25);
    }

    /* Responsive */
    @media (max-width: 640px) {
      body { padding: 16px; }
      .container { padding: 24px 18px; }
      h1 { font-size: 24px; }
      .acciones { justify-content: center; }
      .acciones button { width: 100%; justify-content: center; }
      .inline-group { flex-wrap: wrap; }
      .inline-group .btn-icon { width: 100%; }
    }

    @media (max-width: 480px) {
      .container { padding: 18px 14px; }
      .form-group select,
      .form-group input[type="text"] { font-size: 14px; padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-image"></i> Editar Imagen y Sitio de Serie</h1>

    <!-- Serie -->
    <div class="form-group">
      <label><i class="fas fa-tv"></i> Nombre de la Serie</label>
      <select id="serieSelect">
        <option value="" disabled selected>Seleccionar serie...</option>
      </select>
    </div>

    <!-- Temporada -->
    <div class="form-group">
      <label><i class="fas fa-layer-group"></i> Temporada</label>
      <div class="inline-group">
        <select id="temporadaSelect">
          <option value="" disabled selected>Seleccionar temporada...</option>
        </select>
        <button class="btn-icon" onclick="nuevaTemporada()" title="Nueva temporada">
          <i class="fas fa-plus"></i>
        </button>
      </div>
      <div id="nuevaTemporadaInput" class="hidden-input-group">
        <input type="text" id="inputNuevaTemporada" placeholder="Ej: Temporada 02" />
        <div class="btn-group">
          <button onclick="guardarNuevaTemporada()">Guardar</button>
          <button onclick="cancelarNuevaTemporada()">Cancelar</button>
        </div>
      </div>
    </div>

    <!-- Imagen -->
    <div class="form-group">
      <label><i class="fas fa-image"></i> Enlace de la Imagen (Portada)</label>
      <input type="text" id="enlaceImagen" placeholder="https://ejemplo.com/imagen.jpg" />
    </div>

    <!-- Sitio principal -->
    <div class="form-group">
      <label><i class="fas fa-link"></i> Enlace del Sitio</label>
      <input type="text" id="enlaceSitio" placeholder="https://sitio.com/serie/episodios" />
    </div>

    <!-- Sitio secundario -->
    <div class="form-group">
      <label><i class="fas fa-link"></i> Segundo Enlace del Sitio</label>
      <input type="text" id="enlaceSitio02" placeholder="https://sitio.com/serie/episodios" />
    </div>

    <!-- Vista previa -->
    <div class="preview" id="previewImagen">
      <div class="placeholder">
        <i class="fas fa-image"></i>
        <span>Vista previa de la imagen</span>
      </div>
    </div>

    <!-- Acciones -->
    <div class="acciones">
      <button class="btn-cloudflare" onclick="location.href='Interfaces-Cloudflare/Editar-Portada-Serie.html'">
        <i class="fas fa-cloud"></i> Editar con Cloudflare
      </button>
      <button class="btn-guardar" onclick="guardarCambios()">
        <i class="fas fa-save"></i> Guardar Cambios
      </button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js_firebase/Editar_PortadaSerie_Controller.js"></script>
  
</body>
</html>
