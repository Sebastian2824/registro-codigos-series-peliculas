<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Eliminación - Firebase | Modo Texto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 12px 24px;
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }
    .tab-btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
    .tab-btn.active { background: white; color: #667eea; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    .tab-panel {
      display: none;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      animation: fadeIn 0.5s ease;
    }
    .tab-panel.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    select, input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s;
    }
    select:focus, input:focus {
      border-color: #667eea;
      outline: none;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
      background: #f8f9fa;
      padding: 20px;
      border-radius: 15px;
    }
    .table-container {
      overflow-x: auto;
      margin-top: 20px;
      max-height: 500px;
      overflow-y: auto;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      background: #667eea;
      color: white;
      padding: 12px;
      text-align: left;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    td {
      padding: 12px;
      border-bottom: 1px solid #e0e0e0;
      word-break: break-all;
    }
    tr:hover {
      background: #f8f9fa;
    }
    .checkbox-cell {
      text-align: center;
      width: 40px;
    }
    .checkbox-cell input {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-right: 10px;
    }
    .btn-danger { background: #e53e3e; color: white; }
    .btn-danger:hover { background: #c53030; transform: translateY(-2px); }
    .btn-warning { background: #ed8936; color: white; }
    .btn-warning:hover { background: #dd6b20; }
    .btn-info { background: #4299e1; color: white; }
    .btn-info:hover { background: #3182ce; }
    .action-buttons {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .message {
      padding: 12px;
      border-radius: 10px;
      margin-top: 20px;
      display: none;
    }
    .message.success {
      background: #c6f6d5;
      color: #22543d;
      border-left: 4px solid #48bb78;
      display: block;
    }
    .message.error {
      background: #fed7d7;
      color: #742a2a;
      border-left: 4px solid #e53e3e;
      display: block;
    }
    .message.info {
      background: #bee3f8;
      color: #2c5282;
      border-left: 4px solid #4299e1;
      display: block;
    }
    .counter {
      background: #e8f0fe;
      padding: 10px 15px;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: bold;
      color: #2c5282;
      display: inline-block;
    }
    .url-text {
      font-family: monospace;
      font-size: 12px;
      color: #4a5568;
      background: #f7fafc;
      padding: 4px 8px;
      border-radius: 4px;
      word-break: break-all;
    }
    @media (max-width: 768px) {
      .tab-panel { padding: 20px; }
      .filters { grid-template-columns: 1fr; }
      .action-buttons { flex-direction: column; }
      .btn { width: 100%; margin-bottom: 10px; }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">
    <h1>🗑️ Sistema de Eliminación - Firebase</h1>

    <div class="tabs">
      <button class="tab-btn active" data-tab="iframe">📺 Iframe (animes-series)</button>
      <button class="tab-btn" data-tab="enlaces">🔗 Enlaces (animes-series-enlaces)</button>
      <button class="tab-btn" data-tab="descargas">⬇️ Descargas (animes-series-descargas)</button>
      <button class="tab-btn" data-tab="original">🎬 Original (animes-series-original)</button>
      <button class="tab-btn" onclick="location.href='Interfaces_Cloudflare/Eliminación de Serie General.html'" 
  style="background-color: #10b981; color: white;">
  Eliminar en Cloudflare
</button>
    </div>

    <!-- Panel Iframe -->
    <div class="tab-panel active" id="panel-iframe">
      <div class="filters">
        <div class="form-group">
          <label>📺 Serie:</label>
          <select id="iframe-serie" onchange="cargarTemporadas('iframe')">
            <option value="">Cargando series...</option>
          </select>
        </div>
        <div class="form-group">
          <label>📅 Temporada:</label>
          <select id="iframe-temporada" onchange="cargarIdiomas('iframe')" disabled>
            <option value="">Primero selecciona una serie</option>
          </select>
        </div>
        <div class="form-group">
          <label>🌍 Idioma:</label>
          <select id="iframe-idioma" onchange="cargarServidores('iframe')" disabled>
            <option value="">Primero selecciona una temporada</option>
          </select>
        </div>
        <div class="form-group">
          <label>🖥️ Servidor:</label>
          <select id="iframe-servidor" onchange="cargarEpisodios('iframe')" disabled>
            <option value="">Primero selecciona un idioma</option>
          </select>
        </div>
      </div>

      <div class="table-container">
        <table id="iframe-tabla">
          <thead>
            <tr>
              <th class="checkbox-cell"><input type="checkbox" id="iframe-select-all" onchange="seleccionarTodos('iframe')"></th>
              <th style="width: 15%">Episodio</th>
              <th style="width: 85%">Código Iframe (texto plano)</th>
            </thead>
          <tbody id="iframe-tbody">
            <tr><td colspan="3" style="text-align: center;">Selecciona los filtros para ver los episodios</td>
          </tbody>
         </table>
      </div>

      <div id="iframe-counter" class="counter" style="display: none;"></div>

      <div class="action-buttons">
        <button class="btn btn-danger" onclick="eliminarSeleccionados('iframe')">🗑️ Eliminar Episodios Seleccionados</button>
        <button class="btn btn-warning" onclick="eliminarServidorCompleto('iframe')">⚠️ Eliminar TODOS los episodios de este servidor</button>
        <button class="btn btn-info" onclick="recargarEpisodios('iframe')">🔄 Recargar</button>
      </div>
    </div>

    <!-- Panel Enlaces -->
    <div class="tab-panel" id="panel-enlaces">
      <div class="filters">
        <div class="form-group"><label>🔗 Serie:</label><select id="enlaces-serie" onchange="cargarTemporadas('enlaces')"><option>Cargando...</option></select></div>
        <div class="form-group"><label>📅 Temporada:</label><select id="enlaces-temporada" onchange="cargarIdiomas('enlaces')" disabled><option>Primero selecciona serie</option></select></div>
        <div class="form-group"><label>🌍 Idioma:</label><select id="enlaces-idioma" onchange="cargarServidores('enlaces')" disabled><option>Primero selecciona temporada</option></select></div>
        <div class="form-group"><label>🖥️ Servidor:</label><select id="enlaces-servidor" onchange="cargarEpisodios('enlaces')" disabled><option>Primero selecciona idioma</option></select></div>
      </div>
      <div class="table-container"><table id="enlaces-tabla"><thead> <tr><th class="checkbox-cell"><input type="checkbox" id="enlaces-select-all" onchange="seleccionarTodos('enlaces')"></th><th style="width: 15%">Episodio</th><th style="width: 85%">URL</th> </tr></thead><tbody id="enlaces-tbody"><tr><td colspan="3">Selecciona filtros</td></tr></tbody></table></div>
      <div id="enlaces-counter" class="counter" style="display: none;"></div>
      <div class="action-buttons"><button class="btn btn-danger" onclick="eliminarSeleccionados('enlaces')">🗑️ Eliminar Seleccionados</button><button class="btn btn-warning" onclick="eliminarServidorCompleto('enlaces')">⚠️ Eliminar Servidor</button><button class="btn btn-info" onclick="recargarEpisodios('enlaces')">🔄 Recargar</button></div>
    </div>

    <!-- Panel Descargas -->
    <div class="tab-panel" id="panel-descargas">
      <div class="filters">
        <div class="form-group"><label>⬇️ Serie:</label><select id="descargas-serie" onchange="cargarTemporadas('descargas')"><option>Cargando...</option></select></div>
        <div class="form-group"><label>📅 Temporada:</label><select id="descargas-temporada" onchange="cargarIdiomas('descargas')" disabled><option>Primero selecciona serie</option></select></div>
        <div class="form-group"><label>🌍 Idioma:</label><select id="descargas-idioma" onchange="cargarServidores('descargas')" disabled><option>Primero selecciona temporada</option></select></div>
        <div class="form-group"><label>🖥️ Servidor:</label><select id="descargas-servidor" onchange="cargarEpisodios('descargas')" disabled><option>Primero selecciona idioma</option></select></div>
      </div>
      <div class="table-container"><table id="descargas-tabla"><thead> <tr><th class="checkbox-cell"><input type="checkbox" id="descargas-select-all" onchange="seleccionarTodos('descargas')"></th><th style="width: 15%">Episodio</th><th style="width: 85%">URL de Descarga</th> </tr></thead><tbody id="descargas-tbody"><tr><td colspan="3">Selecciona filtros</td></tr></tbody></table></div>
      <div id="descargas-counter" class="counter" style="display: none;"></div>
      <div class="action-buttons"><button class="btn btn-danger" onclick="eliminarSeleccionados('descargas')">🗑️ Eliminar Seleccionados</button><button class="btn btn-warning" onclick="eliminarServidorCompleto('descargas')">⚠️ Eliminar Servidor</button><button class="btn btn-info" onclick="recargarEpisodios('descargas')">🔄 Recargar</button></div>
    </div>

    <!-- Panel Original -->
    <div class="tab-panel" id="panel-original">
      <div class="filters">
        <div class="form-group"><label>🎬 Serie:</label><select id="original-serie" onchange="cargarTemporadas('original')"><option>Cargando...</option></select></div>
        <div class="form-group"><label>📅 Temporada:</label><select id="original-temporada" onchange="cargarIdiomas('original')" disabled><option>Primero selecciona serie</option></select></div>
        <div class="form-group"><label>🌍 Idioma:</label><select id="original-idioma" onchange="cargarServidores('original')" disabled><option>Primero selecciona temporada</option></select></div>
        <div class="form-group"><label>🖥️ Servidor:</label><select id="original-servidor" onchange="cargarEpisodios('original')" disabled><option>Primero selecciona idioma</option></select></div>
      </div>
      <div class="table-container"><table id="original-tabla"><thead> <tr><th class="checkbox-cell"><input type="checkbox" id="original-select-all" onchange="seleccionarTodos('original')"></th><th style="width: 15%">Episodio</th><th style="width: 85%">URL Original</th> </tr></thead><tbody id="original-tbody"><tr><td colspan="3">Selecciona filtros</td></tr></tbody></table></div>
      <div id="original-counter" class="counter" style="display: none;"></div>
      <div class="action-buttons"><button class="btn btn-danger" onclick="eliminarSeleccionados('original')">🗑️ Eliminar Seleccionados</button><button class="btn btn-warning" onclick="eliminarServidorCompleto('original')">⚠️ Eliminar Servidor</button><button class="btn btn-info" onclick="recargarEpisodios('original')">🔄 Recargar</button></div>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script>
    // Inicializar Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyB6MY2y5uyum87PdUHUpY8NNh4D73Yhx4U",
      authDomain: "animes-plus-89b93.firebaseapp.com",
      projectId: "animes-plus-89b93",
      storageBucket: "animes-plus-89b93.appspot.com",
      messagingSenderId: "402867181985",
      appId: "1:402867181985:web:d695b12977fe4270dbd3e0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    const collections = {
      iframe: { name: "animes-series", field: "iframe" },
      enlaces: { name: "animes-series-enlaces", field: "url" },
      descargas: { name: "animes-series-descargas", field: "iframe" },
      original: { name: "animes-series-original", field: "url" }
    };
    
    let episodiosData = { iframe: [], enlaces: [], descargas: [], original: [] };
    
    function showMessage(message, type = 'success') {
      const msgDiv = document.getElementById('message');
      msgDiv.className = `message ${type}`;
      msgDiv.innerHTML = message;
      setTimeout(() => { msgDiv.style.display = 'none'; msgDiv.className = 'message'; }, 5000);
    }
    
    // Funciones de carga comunes
    async function cargarSeries(tipo) {
      try {
        const snapshot = await db.collection(collections[tipo].name).get();
        const series = [];
        snapshot.forEach(doc => series.push(doc.id));
        series.sort();
        const select = document.getElementById(`${tipo}-serie`);
        select.innerHTML = '<option value="">Seleccionar serie...</option>';
        series.forEach(serie => select.innerHTML += `<option value="${serie.replace(/"/g, '&quot;')}">${serie}</option>`);
      } catch (error) { console.error(error); showMessage(`Error: ${error.message}`, 'error'); }
    }
    
    async function cargarTemporadas(tipo) {
      const serie = document.getElementById(`${tipo}-serie`).value;
      if (!serie) return;
      try {
        const snapshot = await db.collection(collections[tipo].name).doc(serie).collection("Temporadas").get();
        const temporadas = [];
        snapshot.forEach(doc => temporadas.push(doc.id));
        temporadas.sort();
        const select = document.getElementById(`${tipo}-temporada`);
        select.innerHTML = '<option value="">Seleccionar temporada...</option>';
        temporadas.forEach(temp => select.innerHTML += `<option value="${temp.replace(/"/g, '&quot;')}">${temp}</option>`);
        select.disabled = false;
        document.getElementById(`${tipo}-idioma`).innerHTML = '<option value="">Primero selecciona temporada</option>';
        document.getElementById(`${tipo}-idioma`).disabled = true;
        document.getElementById(`${tipo}-servidor`).innerHTML = '<option value="">Primero selecciona idioma</option>';
        document.getElementById(`${tipo}-servidor`).disabled = true;
        document.getElementById(`${tipo}-tbody`).innerHTML = '<tr><td colspan="3">Selecciona los filtros para ver los episodios</td></tr>';
        document.getElementById(`${tipo}-counter`).style.display = 'none';
      } catch (error) { console.error(error); }
    }
    
    async function cargarIdiomas(tipo) {
      const serie = document.getElementById(`${tipo}-serie`).value;
      const temporada = document.getElementById(`${tipo}-temporada`).value;
      if (!serie || !temporada) return;
      try {
        const snapshot = await db.collection(collections[tipo].name).doc(serie).collection("Temporadas").doc(temporada).collection("Idiomas").get();
        const idiomas = [];
        snapshot.forEach(doc => idiomas.push(doc.id));
        idiomas.sort();
        const select = document.getElementById(`${tipo}-idioma`);
        select.innerHTML = '<option value="">Seleccionar idioma...</option>';
        idiomas.forEach(idi => select.innerHTML += `<option value="${idi.replace(/"/g, '&quot;')}">${idi}</option>`);
        select.disabled = false;
        document.getElementById(`${tipo}-servidor`).innerHTML = '<option value="">Primero selecciona idioma</option>';
        document.getElementById(`${tipo}-servidor`).disabled = true;
        document.getElementById(`${tipo}-tbody`).innerHTML = '<tr><td colspan="3">Selecciona un servidor para ver los episodios</td></tr>';
        document.getElementById(`${tipo}-counter`).style.display = 'none';
      } catch (error) { console.error(error); }
    }
    
    async function cargarServidores(tipo) {
      const serie = document.getElementById(`${tipo}-serie`).value;
      const temporada = document.getElementById(`${tipo}-temporada`).value;
      const idioma = document.getElementById(`${tipo}-idioma`).value;
      if (!serie || !temporada || !idioma) return;
      try {
        const snapshot = await db.collection(collections[tipo].name).doc(serie).collection("Temporadas").doc(temporada).collection("Idiomas").doc(idioma).collection("Servidores").get();
        const servidores = [];
        snapshot.forEach(doc => servidores.push(doc.id));
        servidores.sort();
        const select = document.getElementById(`${tipo}-servidor`);
        select.innerHTML = '<option value="">Seleccionar servidor...</option>';
        servidores.forEach(serv => select.innerHTML += `<option value="${serv.replace(/"/g, '&quot;')}">${serv}</option>`);
        select.disabled = false;
        document.getElementById(`${tipo}-tbody`).innerHTML = '<tr><td colspan="3">Selecciona un servidor para ver los episodios</td></tr>';
        document.getElementById(`${tipo}-counter`).style.display = 'none';
      } catch (error) { console.error(error); }
    }
    
    async function cargarEpisodios(tipo) {
      const serie = document.getElementById(`${tipo}-serie`).value;
      const temporada = document.getElementById(`${tipo}-temporada`).value;
      const idioma = document.getElementById(`${tipo}-idioma`).value;
      const servidor = document.getElementById(`${tipo}-servidor`).value;
      
      if (!serie || !temporada || !idioma || !servidor) return;
      
      try {
        const episodiosRef = db.collection(collections[tipo].name).doc(serie)
          .collection("Temporadas").doc(temporada)
          .collection("Idiomas").doc(idioma)
          .collection("Servidores").doc(servidor)
          .collection("Episodios");
        
        const snapshot = await episodiosRef.get();
        const episodios = [];
        
        snapshot.forEach(doc => {
          const data = doc.data();
          episodios.push({
            episodio: doc.id,
            contenido: data[collections[tipo].field] || 'N/A'
          });
        });
        
        // Ordenar episodios numéricamente
        episodios.sort((a, b) => {
          const numA = parseInt(a.episodio.match(/\d+/)) || 0;
          const numB = parseInt(b.episodio.match(/\d+/)) || 0;
          return numA - numB;
        });
        
        episodiosData[tipo] = episodios;
        
        const tbody = document.getElementById(`${tipo}-tbody`);
        const counterDiv = document.getElementById(`${tipo}-counter`);
        
        if (episodios.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3">⚠️ No hay episodios en este servidor</td></tr>';
          counterDiv.style.display = 'none';
          return;
        }
        
        counterDiv.innerHTML = `📊 Total: ${episodios.length} episodio(s) encontrado(s)`;
        counterDiv.style.display = 'block';
        
        // Mostrar todos los episodios como texto plano
        let html = '';
        for (const ep of episodios) {
          // Mostrar el contenido completo como texto plano
          let contenido = ep.contenido;
          // Si es muy largo, mostrar con scroll
          const displayContenido = contenido.length > 200 
            ? `<div style="max-height: 100px; overflow-y: auto; font-family: monospace; font-size: 11px; background: #f7fafc; padding: 8px; border-radius: 4px;">${escapeHtml(contenido)}</div>`
            : `<span class="url-text">${escapeHtml(contenido)}</span>`;
          
          html += `
            <tr>
              <td class="checkbox-cell"><input type="checkbox" value="${escapeHtml(ep.episodio)}" class="episodio-checkbox-${tipo}"></td>
              <td><strong>${escapeHtml(ep.episodio)}</strong></td>
              <td>${displayContenido}</td>
            </tr>
          `;
        }
        tbody.innerHTML = html;
        
        // Desmarcar select all
        const selectAll = document.getElementById(`${tipo}-select-all`);
        if (selectAll) selectAll.checked = false;
        
        console.log(`✅ ${tipo}: ${episodios.length} episodios mostrados en tabla`);
        
      } catch (error) {
        console.error(error);
        document.getElementById(`${tipo}-tbody`).innerHTML = `<tr><td colspan="3">❌ Error: ${error.message}</td></tr>`;
      }
    }
    
    // Función para escapar HTML
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function recargarEpisodios(tipo) {
      cargarEpisodios(tipo);
      showMessage('Episodios recargados', 'info');
    }
    
    function seleccionarTodos(tipo) {
      const selectAll = document.getElementById(`${tipo}-select-all`);
      const checkboxes = document.querySelectorAll(`.episodio-checkbox-${tipo}`);
      checkboxes.forEach(cb => cb.checked = selectAll.checked);
    }
    
    async function eliminarSeleccionados(tipo) {
      const serie = document.getElementById(`${tipo}-serie`).value;
      const temporada = document.getElementById(`${tipo}-temporada`).value;
      const idioma = document.getElementById(`${tipo}-idioma`).value;
      const servidor = document.getElementById(`${tipo}-servidor`).value;
      
      const checkboxes = document.querySelectorAll(`.episodio-checkbox-${tipo}:checked`);
      if (checkboxes.length === 0) {
        showMessage('Selecciona al menos un episodio para eliminar', 'error');
        return;
      }
      
      if (!confirm(`¿Estás seguro de eliminar ${checkboxes.length} episodio(s)?\n\nEsta acción no se puede deshacer.`)) return;
      
      let eliminados = 0;
      for (const cb of checkboxes) {
        try {
          await db.collection(collections[tipo].name).doc(serie)
            .collection("Temporadas").doc(temporada)
            .collection("Idiomas").doc(idioma)
            .collection("Servidores").doc(servidor)
            .collection("Episodios").doc(cb.value).delete();
          eliminados++;
        } catch (error) {
          console.error(error);
        }
      }
      
      // Verificar si el servidor quedó vacío
      const restantes = await db.collection(collections[tipo].name).doc(serie)
        .collection("Temporadas").doc(temporada)
        .collection("Idiomas").doc(idioma)
        .collection("Servidores").doc(servidor)
        .collection("Episodios").get();
      
      if (restantes.size === 0) {
        try {
          await db.collection(collections[tipo].name).doc(serie)
            .collection("Temporadas").doc(temporada)
            .collection("Idiomas").doc(idioma)
            .collection("Servidores").doc(servidor).delete();
          showMessage(`✅ Servidor "${servidor}" eliminado automáticamente (quedó vacío)`, 'success');
          await cargarServidores(tipo);
        } catch (error) {
          console.error(error);
        }
      }
      
      showMessage(`✅ ${eliminados} episodios eliminados correctamente`, 'success');
      await cargarEpisodios(tipo);
    }
    
    async function eliminarServidorCompleto(tipo) {
      const serie = document.getElementById(`${tipo}-serie`).value;
      const temporada = document.getElementById(`${tipo}-temporada`).value;
      const idioma = document.getElementById(`${tipo}-idioma`).value;
      const servidor = document.getElementById(`${tipo}-servidor`).value;
      
      if (!serie || !temporada || !idioma || !servidor) {
        showMessage('Selecciona todos los filtros antes de eliminar un servidor completo', 'error');
        return;
      }
      
      const total = episodiosData[tipo]?.length || 0;
      
      if (!confirm(`⚠️ ADVERTENCIA: Esto eliminará TODOS los ${total} episodios del servidor "${servidor}"\n\nEsta acción es irreversible.\n\n¿Estás completamente seguro?`)) return;
      
      try {
        const servidorRef = db.collection(collections[tipo].name).doc(serie)
          .collection("Temporadas").doc(temporada)
          .collection("Idiomas").doc(idioma)
          .collection("Servidores").doc(servidor);
        
        const episodiosRef = servidorRef.collection("Episodios");
        const snapshot = await episodiosRef.get();
        const batch = db.batch();
        snapshot.forEach(doc => batch.delete(doc.ref));
        batch.delete(servidorRef);
        await batch.commit();
        
        showMessage(`✅ Servidor "${servidor}" eliminado correctamente con todos sus ${snapshot.size} episodios`, 'success');
        await cargarServidores(tipo);
        document.getElementById(`${tipo}-tbody`).innerHTML = '<tr><td colspan="3">Servidor eliminado</td></tr>';
        document.getElementById(`${tipo}-counter`).style.display = 'none';
      } catch (error) {
        showMessage(`Error: ${error.message}`, 'error');
      }
    }
    
    // Exponer funciones globales
    window.cargarSeries = cargarSeries;
    window.cargarTemporadas = cargarTemporadas;
    window.cargarIdiomas = cargarIdiomas;
    window.cargarServidores = cargarServidores;
    window.cargarEpisodios = cargarEpisodios;
    window.recargarEpisodios = recargarEpisodios;
    window.seleccionarTodos = seleccionarTodos;
    window.eliminarSeleccionados = eliminarSeleccionados;
    window.eliminarServidorCompleto = eliminarServidorCompleto;
    
    // Inicializar
    cargarSeries('iframe');
    cargarSeries('enlaces');
    cargarSeries('descargas');
    cargarSeries('original');
    
    // Manejo de tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tabId = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`panel-${tabId}`).classList.add('active');
      });
    });
  </script>
</body>
</html>
