<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Importar URLs de Series a Cloudflare</title>
  <style>
    body {
      font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      padding: 30px;
      background: #f8fafc;
      color: #2d3748;
      max-width: 1200px;
      margin: 0 auto;
    }
    h2 {
      color: #1e3a8a;
      font-weight: 600;
      margin-bottom: 25px;
      border-bottom: 2px solid #3b82f6;
      padding-bottom: 10px;
    }
    #inputExcel {
      display: block;
      margin: 20px 0;
      padding: 12px;
      border: 2px dashed #3b82f6;
      border-radius: 8px;
      background-color: #f0f7ff;
      color: #1e40af;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #inputExcel:hover {
      background-color: #e0f2fe;
      border-color: #2563eb;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 25px 0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      font-size: 14px;
    }
    th {
      background-color: #1e40af;
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    tr:nth-child(even) {
      background-color: #f8fafc;
    }
    tr:nth-child(odd) {
      background-color: #f1f5f9;
    }
    tr:hover {
      background-color: #e0f2fe;
    }
    
    /* Estilos mejorados para la barra de progreso */
    .progress-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }
    
    .progress-container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      min-width: 450px;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    .progress-title {
      font-size: 20px;
      font-weight: bold;
      color: #1a73e8;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .progress-info {
      margin: 15px 0;
      padding: 10px;
      background: #f8fbff;
      border-radius: 8px;
      font-size: 14px;
    }
    
    .progress-info p {
      margin: 5px 0;
    }
    
    .progress-bar-wrapper {
      background-color: #e0e9ff;
      border-radius: 10px;
      overflow: hidden;
      margin: 20px 0;
      height: 30px;
    }
    
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #1a73e8, #34a853, #ffd700);
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }
    
    .progress-status {
      text-align: center;
      margin-top: 15px;
      color: #666;
      font-size: 14px;
    }
    
    .progress-details {
      font-family: monospace;
      font-size: 12px;
      color: #555;
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    
    .progress-details p {
      margin: 5px 0;
      font-size: 11px;
    }

    .btn-firebase {
      background-color: #10b981;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 20px;
      display: inline-block;
    }
    
    .btn-firebase:hover {
      background-color: #059669;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(16, 185, 129, 0.3);
    }
    
    #saveButton {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
      display: block;
      margin: 20px auto;
      font-size: 16px;
    }
    
    #saveButton:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(37, 99, 235, 0.3);
    }
    
    #saveButton:active {
      transform: translateY(0);
    }
    
    #saveButton:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
      transform: none;
    }
    
    #panelPreview {
      margin-top: 30px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .url-cell {
      max-width: 300px;
      overflow-x: auto;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h2>🔗 Registrar / Actualizar URLs de Series en Cloudflare desde Excel</h2>
  <input type="file" id="inputExcel" accept=".xlsx">

  <button onclick="location.href='../Registro&Editar_Excel_URLSerie.html'" 
  class="btn-firebase">
  🔥 Ir al registro con Firebase
</button>

  <button id="saveButton" disabled>💾 Guardar en Cloudflare</button>

  <div id="panelPreview"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
    const WORKER_URL = 'https://proyect-cloud-flare.apiprueba2025.workers.dev';
    
    let datosPreview = [];

    function escapeHTML(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Función para mostrar barra de progreso mejorada
    function mostrarProgreso(titulo, totalItems) {
      const overlay = document.createElement('div');
      overlay.className = 'progress-overlay';
      overlay.id = 'progressOverlay';
      overlay.innerHTML = `
        <div class="progress-container">
          <div class="progress-title">${titulo}</div>
          <div class="progress-info">
            <p>📊 Total a procesar: <strong>${totalItems}</strong></p>
            <p>📦 Envío en bloques de 50 registros</p>
          </div>
          <div class="progress-bar-wrapper">
            <div class="progress-bar" id="progressBar">0%</div>
          </div>
          <div class="progress-status" id="progressStatus">Iniciando proceso...</div>
          <div class="progress-details" id="progressDetails"></div>
        </div>
      `;
      document.body.appendChild(overlay);
      return {
        update: (progreso, mensaje, detalle) => {
          const barra = document.getElementById('progressBar');
          const status = document.getElementById('progressStatus');
          const details = document.getElementById('progressDetails');
          
          if (barra) {
            const porcentaje = Math.round(progreso);
            barra.style.width = `${porcentaje}%`;
            barra.textContent = `${porcentaje}%`;
          }
          if (status && mensaje) status.textContent = mensaje;
          if (details && detalle) {
            const p = document.createElement('p');
            p.textContent = detalle;
            details.appendChild(p);
            details.scrollTop = details.scrollHeight;
          }
        },
        cerrar: () => {
          const overlayExistente = document.getElementById('progressOverlay');
          if (overlayExistente) overlayExistente.remove();
        }
      };
    }

    document.getElementById("inputExcel").addEventListener("change", async function (e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function (e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const hoja = workbook.Sheets[workbook.SheetNames[0]];
        const datos = XLSX.utils.sheet_to_json(hoja);
        datosPreview = [];
        document.getElementById("panelPreview").innerHTML = "";

        datos.forEach(row => {
          const nombreSerie = row["Serie"]?.trim();
          const temporada = row["Temporada"]?.trim();
          const idioma = row["Idioma"]?.trim();
          const episodio = row["Episodio"]?.trim();

          Object.keys(row).forEach(col => {
            if (!["Serie", "Temporada", "Idioma", "Episodio"].includes(col)) {
              const servidor = col.trim();
              const url = row[col]?.toString().trim();
              if (url && url !== "-") {
                datosPreview.push({ 
                  nombreSerie, 
                  temporada, 
                  idioma, 
                  episodio, 
                  servidor, 
                  url 
                });
              }
            }
          });
        });

        if (datosPreview.length > 0) {
          const tablaHTML = `</table>
            <thead>
              <tr>
                <th>Serie</th>
                <th>Temporada</th>
                <th>Idioma</th>
                <th>Episodio</th>
                <th>Servidor</th>
                <th>URL</th>
              </tr>
            </thead>
            <tbody>
              ${datosPreview.map(d => `
                <tr>
                  <td>${escapeHTML(d.nombreSerie)}</td>
                  <td>${escapeHTML(d.temporada)}</td>
                  <td>${escapeHTML(d.idioma)}</td>
                  <td>${escapeHTML(d.episodio)}</td>
                  <td>${escapeHTML(d.servidor)}</td>
                  <td class="url-cell">${escapeHTML(d.url.substring(0, 100))}${d.url.length > 100 ? '...' : ''}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>`;
          
          document.getElementById("panelPreview").innerHTML = tablaHTML;
          document.getElementById("saveButton").disabled = false;
          document.getElementById("saveButton").style.opacity = "1";
        } else {
          document.getElementById("panelPreview").innerHTML = '<div style="text-align: center; padding: 40px; color: #666;">⚠️ No se encontraron datos válidos en el archivo Excel</div>';
          document.getElementById("saveButton").disabled = true;
        }
      };
      reader.readAsArrayBuffer(file);
    });

    document.getElementById("saveButton").addEventListener("click", async function () {
      const total = datosPreview.length;
      if (total === 0) return alert("No hay datos para guardar.");
      
      // Deshabilitar botón durante el proceso
      const saveButton = document.getElementById("saveButton");
      saveButton.disabled = true;
      saveButton.textContent = "⏳ Enviando a Cloudflare...";
      
      const progreso = mostrarProgreso('Importando URLs de series a Cloudflare', total);
      const chunkSize = 50;
      let procesados = 0;
      let bloquesExitosos = 0;
      let bloquesFallidos = 0;
      let registrosExitosos = 0;

      try {
        for (let i = 0; i < total; i += chunkSize) {
          const chunk = datosPreview.slice(i, i + chunkSize);
          const bloqueActual = Math.floor(i / chunkSize) + 1;
          const totalBloques = Math.ceil(total / chunkSize);
          const inicioBloque = i + 1;
          const finBloque = Math.min(i + chunkSize, total);
          
          progreso.update(
            (procesados / total) * 100,
            `Enviando bloque ${bloqueActual} de ${totalBloques} (registros ${inicioBloque}-${finBloque})...`,
            `📦 Enviando ${chunk.length} URLs al servidor Cloudflare...`
          );
          
          try {
            const response = await fetch(`${WORKER_URL}/registrar-url`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ registros: chunk }),
            });

            if (!response.ok) {
              const error = await response.json();
              throw new Error(JSON.stringify(error));
            }

            const data = await response.json();
            bloquesExitosos++;
            registrosExitosos += chunk.length;
            
            progreso.update(
              (procesados / total) * 100,
              `✅ Bloque ${bloqueActual} enviado exitosamente`,
              `✅ ${chunk.length} URLs guardadas en Cloudflare - Respuesta: ${data.message || 'OK'}`
            );
            
          } catch (error) {
            bloquesFallidos++;
            progreso.update(
              (procesados / total) * 100,
              `❌ Error en bloque ${bloqueActual}`,
              `❌ Falló el envío de ${chunk.length} URLs: ${error.message.substring(0, 100)}`
            );
            console.error(`Error en bloque ${bloqueActual}:`, error);
          }
          
          procesados += chunk.length;
          const percent = Math.round((procesados / total) * 100);
          progreso.update(percent, `Progreso: ${percent}% completado`, `📊 Procesadas ${procesados} de ${total} URLs`);
          
          // Pequeña pausa entre bloques
          await new Promise(resolve => setTimeout(resolve, 100));
        }
        
        let mensajeFinal = `📊 RESUMEN DE IMPORTACIÓN A CLOUDFLARE\n\n`;
        mensajeFinal += `✅ Bloques exitosos: ${bloquesExitosos}\n`;
        mensajeFinal += `❌ Bloques fallidos: ${bloquesFallidos}\n`;
        mensajeFinal += `📝 URLs enviadas: ${total}\n`;
        mensajeFinal += `✔️ URLs exitosas: ${registrosExitosos}\n`;
        
        if (bloquesFallidos === 0) {
          mensajeFinal += `\n🎉 ¡Todas las URLs se registraron correctamente en Cloudflare!`;
        } else {
          mensajeFinal += `\n⚠️ Algunos bloques fallaron. Por favor, revisa los datos e intenta nuevamente.`;
        }
        
        progreso.update(100, 'Proceso completado', mensajeFinal);
        await new Promise(resolve => setTimeout(resolve, 3000));
        progreso.cerrar();
        
        alert(mensajeFinal);
        
        if (bloquesExitosos > 0 && bloquesFallidos === 0) {
          setTimeout(() => location.reload(), 1500);
        }
        
      } catch (error) {
        progreso.cerrar();
        console.error("Error al guardar en Cloudflare:", error);
        alert(`❌ Error al guardar en Cloudflare: ${error.message}`);
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "💾 Guardar en Cloudflare";
      }
    });
  </script>
</body>
</html>
