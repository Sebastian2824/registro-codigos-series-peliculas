<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión · Animes Plus</title>
  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: radial-gradient(circle at 10% 30%, rgba(26, 115, 232, 0.06) 0%, transparent 60%);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(0, 20, 40, 0.08), 0 8px 24px rgba(0, 20, 40, 0.04);
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .login-header {
      background: linear-gradient(135deg, #0b2b5c 0%, #1a4b8c 100%);
      padding: 36px 28px 30px;
      text-align: center;
      position: relative;
    }

    .login-header .logo {
      width: 80px;
      height: 80px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease;
    }

    .login-header .logo:hover {
      transform: scale(1.05);
    }

    .login-header .logo i {
      font-size: 38px;
      color: #1a73e8;
    }

    .login-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: white;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .login-header p {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 400;
    }

    .login-body {
      padding: 32px 28px 28px;
    }

    .input-group {
      margin-bottom: 22px;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #0b2b5c;
      margin-bottom: 6px;
    }

    .input-group label i {
      margin-right: 6px;
      color: #1a73e8;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-size: 15px;
      background: #fafcff;
      transition: all 0.25s ease;
      font-family: inherit;
      color: #1e293b;
    }

    .input-group input:focus {
      border-color: #1a73e8;
      outline: none;
      box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.08);
      background: white;
    }

    .input-group .input-icon {
      position: absolute;
      left: 16px;
      top: 42px;
      color: #94a3b8;
      font-size: 16px;
      transition: color 0.2s;
      pointer-events: none;
    }

    .input-group input:focus ~ .input-icon {
      color: #1a73e8;
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .remember-forgot .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #475569;
    }

    .remember-forgot .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #1a73e8;
      cursor: pointer;
    }

    .remember-forgot .forgot-password a {
      color: #1a73e8;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }

    .remember-forgot .forgot-password a:hover {
      color: #1557b0;
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1a73e8, #1557b0);
      color: white;
      border: none;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(26, 115, 232, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      margin-bottom: 20px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(26, 115, 232, 0.3);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn i {
      font-size: 18px;
    }

    .social-login {
      text-align: center;
      margin-top: 8px;
    }

    .social-login p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 16px;
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .social-login p::before,
    .social-login p::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .social-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      color: #1e293b;
      font-size: 18px;
      transition: all 0.25s ease;
      border: 1px solid transparent;
      text-decoration: none;
    }

    .social-icon:hover {
      background: #1a73e8;
      color: white;
      border-color: #1a73e8;
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(26, 115, 232, 0.15);
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #475569;
    }

    .register-link a {
      color: #1a73e8;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }

    .register-link a:hover {
      color: #1557b0;
      text-decoration: underline;
    }

    /* ===== Ventana flotante de recuperación ===== */
    #ventana-recuperacion {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
    }

    #ventana-recuperacion .modal {
      background: white;
      border-radius: 28px;
      max-width: 420px;
      width: 100%;
      padding: 32px 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
      animation: modalFade 0.3s ease;
    }

    @keyframes modalFade {
      0% { opacity: 0; transform: scale(0.95) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    #ventana-recuperacion .modal h2 {
      font-size: 22px;
      font-weight: 700;
      color: #0b2b5c;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #ventana-recuperacion .modal h2 i {
      color: #1a73e8;
    }

    #ventana-recuperacion .modal .sub {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 20px;
    }

    #ventana-recuperacion .modal input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-size: 15px;
      margin-bottom: 14px;
      font-family: inherit;
      transition: all 0.2s;
      background: #fafcff;
    }

    #ventana-recuperacion .modal input:focus {
      border-color: #1a73e8;
      outline: none;
      box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.08);
      background: white;
    }

    #ventana-recuperacion .modal .btn-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    #ventana-recuperacion .modal .btn-actions button {
      padding: 12px 24px;
      border: none;
      border-radius: 40px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      flex: 1;
    }

    #ventana-recuperacion .modal .btn-actions .btn-primary {
      background: #1a73e8;
      color: white;
    }

    #ventana-recuperacion .modal .btn-actions .btn-primary:hover {
      background: #1557b0;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26, 115, 232, 0.2);
    }

    #ventana-recuperacion .modal .btn-actions .btn-secondary {
      background: #f1f5f9;
      color: #1e293b;
    }

    #ventana-recuperacion .modal .btn-actions .btn-secondary:hover {
      background: #e2e8f0;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-header {
        padding: 28px 20px 24px;
      }
      .login-header h1 {
        font-size: 24px;
      }
      .login-body {
        padding: 24px 20px 20px;
      }
      .login-header .logo {
        width: 68px;
        height: 68px;
      }
      .login-header .logo i {
        font-size: 32px;
      }
      #ventana-recuperacion .modal {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="logo">
        <i class="fas fa-film"></i>
      </div>
      <h1>Bienvenido</h1>
      <p>Inicia sesión en tu cuenta</p>
    </div>

    <div class="login-body">
      <form autocomplete="off" id="loginForm">
        <div class="input-group">
          <label for="correo"><i class="fas fa-envelope"></i> Correo</label>
          <input type="email" id="correo" placeholder="tucorreo@ejemplo.com" required>
          <i class="fas fa-user input-icon"></i>
        </div>

        <div class="input-group">
          <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required>
          <i class="fas fa-key input-icon"></i>
        </div>

        <div class="remember-forgot">
          <div class="forgot-password">
            <a href="#" id="forgotLink">¿Olvidaste tu contraseña?</a>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
        </button>

      </form>
    </div>
  </div>

  <!-- Ventana flotante de recuperación -->
  <div id="ventana-recuperacion">
    <div class="modal">
      <h2><i class="fas fa-key"></i> Recuperar Contraseña</h2>
      <p class="sub">Ingresa tus datos para restablecer tu contraseña.</p>
      <input type="email" id="recuperar-correo" placeholder="Correo electrónico" required>
      <input type="text" id="recuperar-fecha" placeholder="Fecha de nacimiento (DD/MM/AAAA)" required>
      <input type="password" id="nueva-password" placeholder="Nueva contraseña" required>
      <div class="btn-actions">
        <button class="btn-primary" id="btn-actualizar-password">Actualizar</button>
        <button class="btn-secondary" id="btn-cancelar-recuperacion">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js_firebase/Login_Controller.js"></script>
  <script src="js_multi_servidor/bloqueo.js"></script>
  
</body>
</html>
